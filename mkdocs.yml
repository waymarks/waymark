site_name: Waymark
site_url: https://shaifulshabuj.github.io/waymark/
repo_url: https://github.com/waymarks/waymark
repo_name: shaifulshabuj/waymark
docs_dir: mkdocs-docs

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.tabs.link
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - minify:
      minify_html: true
  - mike

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  version:
    provider: mike
    default: stable

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Philosophy: philosophy.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Features:
      - Overview: features/index.md
      - Policy Engine: features/policy-engine.md
      - Approvals & Rollback: features/approvals-rollback.md
      - Platform Support: features/platforms.md
      - Team & Sessions: features/team-sessions.md
      - Risk & Remediation: features/risk-remediation.md
      - ML & Analytics: features/ml-analytics.md
      - Enterprise: features/enterprise.md
      - Advanced CLI & Dashboard: features/advanced.md
      - Agent Monitor: features/agent-monitor.md
  - v5 Unified Architecture:
      - Overview & Migration: v5/index.md
  - CLI Reference: reference/cli.md
  - Dashboard Guide: dashboard.md
  - API Reference: reference/api.md
  - FAQ: faq.md
  - Changelog: changelog.md
