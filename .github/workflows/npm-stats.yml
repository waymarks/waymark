name: npm download stats

# Self-contained: scripts/generate-npm-chart.js uses only Node builtins and
# reads the public npm downloads API, so this needs no secrets and no access
# to any other repository. The chart it writes is referenced by README.md.

on:
  schedule:
    - cron: '0 0 * * 0'   # weekly, Sunday
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-npm-chart.js'

permissions:
  contents: write   # to commit the regenerated SVG

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Generate download chart
        run: node scripts/generate-npm-chart.js

      - name: Commit chart if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/npm-downloads.svg
          if git diff --cached --quiet assets/npm-downloads.svg; then
            echo "No change to chart — skipping commit."
          else
            git commit assets/npm-downloads.svg -m "chore: update npm download chart [skip ci]"
            git push
          fi
